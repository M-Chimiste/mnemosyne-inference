[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mnemosyne-macos"
version = "0.1.0"
description = "Native macOS inference coordinator for LM Studio, oMLX, and DwarfStar"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pyyaml>=6,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
]

[project.scripts]
mnemosyne-macos = "mnemosyne_macos.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemosyne_macos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
