[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mnemosyne-macos"
version = "0.9.0"
description = "Native macOS inference coordinator for multiple upstream Apple Silicon engines"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=50,<51",
  "fastapi>=0.115,<1",
  "huggingface-hub>=1.24,<2",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pyyaml>=6,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
]

[project.scripts]
mnemosyne-macos = "mnemosyne_macos.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemosyne_macos"]

[tool.hatch.build.targets.wheel.force-include]
"../../compatibility_catalog/v1/catalog.schema.json" = "mnemosyne_macos/schemas/compatibility_catalog.schema.json"
"../../mac_pool_protocol/v1/desired_install.schema.json" = "mnemosyne_macos/schemas/desired_install.schema.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
