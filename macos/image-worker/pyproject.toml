[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mnemosyne-mflux-worker"
version = "0.9.0"
description = "Process-isolated MFLUX image worker for Mnemosyne Inference"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "mflux==0.18.0",
  "pillow>=11,<13",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
]

[project.scripts]
mnemosyne-mflux-worker = "mnemosyne_mflux_worker.cli:main"

[tool.uv.sources]
# Krea 2 support landed after the 0.18.0 PyPI release. Pin the verified
# upstream merge commit until MFLUX publishes a release containing it.
mflux = { git = "https://github.com/filipstrand/mflux.git", rev = "97ac5e6280e8c65e48a609722229eb9d03ef2cbe" }

[tool.hatch.build.targets.wheel]
packages = ["src/mnemosyne_mflux_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
